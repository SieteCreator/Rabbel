name: Test Android build
on:
  push:
    paths: ['android/**', 'app/**', '.github/workflows/android-build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle -p android assembleDebug
      # The public repository only receives an encrypted archive. The private
      # transfer key stays outside the repository and outside GitHub Actions.
      - name: Encrypt private test build
        run: openssl cms -encrypt -binary -aes-256-cbc -in android/app/build/outputs/apk/debug/app-debug.apk -outform DER -out rabel-test.apk.cms android/transfer/public-cert.pem
      # Create an unreferenced encrypted Git blob, not a commit or release.
      # Its hash allows transfer via the GitHub API when artifact hosts are blocked.
      - name: Transfer encrypted test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import base64,json; print(json.dumps({"content":base64.b64encode(open("rabel-test.apk.cms","rb").read()).decode(),"encoding":"base64"}))' > /tmp/blob.json
          gh api --method POST repos/${{ github.repository }}/git/blobs --input /tmp/blob.json --jq '"Encrypted Git blob: " + .sha'
