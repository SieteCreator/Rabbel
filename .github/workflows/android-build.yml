name: Build Android APK

on:
  push:
    paths: ['android/**', 'app/**', '.github/workflows/android-build.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test JavaScript
        run: node --test

      - name: Build APK (debug, nessun segreto dentro la build)
        run: gradle -p android assembleDebug

      - name: Pubblica l'APK in downloads/
        if: github.ref == 'refs/heads/main'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/Rabel-Gestione.apk
          if git diff --quiet -- downloads/Rabel-Gestione.apk; then
            echo "APK identico al precedente: nessun commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Rabel-Gestione.apk
          git commit -m "Aggiorna APK (build ${GITHUB_SHA::7}) [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - uses: actions/upload-artifact@v4
        with:
          name: rabel-gestione-apk
          path: downloads/Rabel-Gestione.apk
          if-no-files-found: error
          retention-days: 90
