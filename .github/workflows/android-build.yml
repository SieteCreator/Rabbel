name: Build Android APK

on:
  push:
    paths: ['android/**', 'app/**', '.github/workflows/android-build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test JavaScript
        run: node --test

      - name: Build APK (debug, nessun segreto dentro la build)
        run: gradle -p android assembleDebug

      - name: Rinomina l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Rabel-Gestione.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rabel-gestione-apk
          path: Rabel-Gestione.apk
          if-no-files-found: error
          retention-days: 90
