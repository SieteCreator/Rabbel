name: Tests

on:
  push:
    paths: ['app/**', 'tests/**', 'index.html', 'supabase-live.js', '.github/workflows/tests.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
